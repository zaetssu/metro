[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203", "D213",
    "RUF001", "RUF002", "RUF003",
    "COM812", "ISC001",
    "CPY001",  # Игнорировать отсутствие копирайта
    "D107",    # Игнорировать докстринги в __init__
    "C901",    # Игнорировать сложность функции (Дейкстра)
    "INP001",  # Игнорировать отсутствие __init__.py в тестах
    "SLF001",  # Игнорировать доступ к приватным членам в тестах
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "PLR2004"]
"main.py" = ["T201"]